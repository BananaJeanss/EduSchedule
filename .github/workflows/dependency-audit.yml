name: Dependency graph audit
on:
  push:
    branches: [fix/repo-hygiene-security]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Buildscript/plugin dependency graph
        run: ./gradlew buildEnvironment --no-daemon
      - name: App debug runtime graph
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon
      - name: App debug compile graph
        run: ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon
