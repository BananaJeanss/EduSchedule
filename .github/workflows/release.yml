name: Signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Validate version and signing inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable semantic version'; exit 1; }
          : "${SIGNING_KEYSTORE_BASE64:?Missing signing keystore secret}"
          : "${SIGNING_STORE_PASSWORD:?Missing store password}"
          : "${SIGNING_KEY_ALIAS:?Missing key alias variable}"
          : "${SIGNING_KEY_PASSWORD:?Missing key password}"
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed APK and bundle
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease bundleRelease -PversionName="$RELEASE_VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
      - name: Verify signature and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/EduSchedule-$RELEASE_VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/EduSchedule-$RELEASE_VERSION.aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/EduSchedule-$RELEASE_VERSION.apk" > dist/signature.txt
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$RELEASE_VERSION" dist/* --target "$GITHUB_SHA" --title "EduSchedule $RELEASE_VERSION" --generate-notes
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
