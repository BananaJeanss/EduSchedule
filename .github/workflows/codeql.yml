name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Prepare CodeQL Kotlin compatibility build
        shell: bash
        run: |
          set -euo pipefail
          # The project and all shipping builds stay on patched Kotlin 2.4.20.
          # CodeQL bundle 2.27.0 currently rejects 2.4.20, so only this ephemeral
          # analysis workspace compiles with 2.4.10. Gradle caches are disabled
          # below, and no artifact from this compatibility build is published.
          grep -qx 'kotlin = "2.4.20"' gradle/libs.versions.toml
          sed -i 's/^kotlin = "2\.4\.20"$/kotlin = "2.4.10"/' gradle/libs.versions.toml
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile all Kotlin source sets for analysis
        run: ./gradlew clean assembleDebug testDebugUnitTest assembleDebugAndroidTest --no-build-cache --no-configuration-cache --no-daemon -Pkotlin.compiler.execution.strategy=in-process
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
