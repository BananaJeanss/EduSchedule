name: Bug report
description: Report a reproducible EduSchedule problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact school names, URLs, student names, teacher names, and private timetable data unless they are strictly necessary.
  - type: input
    id: version
    attributes:
      label: EduSchedule version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version / device
      placeholder: "Android 16, Pixel 8"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots or sanitized logs are welcome. Do not post credentials, signing material, or private timetable data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues first.
          required: true
        - label: I removed unnecessary personal/private data.
          required: true
